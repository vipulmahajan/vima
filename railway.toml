# Railway service configuration for ViMa.
# Reference: https://docs.railway.com/reference/config-as-code

[build]
# Use Nixpacks. System packages (tesseract, poppler, GTK runtime libs)
# are pinned in nixpacks.toml so we don't depend on the auto-detected
# system list shifting under us.
builder = "NIXPACKS"

[deploy]
# uvicorn worker count is driven by WEB_CONCURRENCY (default 2). Increase
# in the Railway dashboard once we have real traffic.
startCommand = "uvicorn main:app --host 0.0.0.0 --port $PORT --workers ${WEB_CONCURRENCY:-2} --proxy-headers --forwarded-allow-ips='*'"

# Active health probe — Railway routes traffic only when /health returns 2xx.
# We deliberately point at /health (not /healthz) so a degraded Supabase
# still surfaces in the response body without restarting the container.
healthcheckPath    = "/health"
healthcheckTimeout = 10

# Restart policy: keep the container up; let our nudge loop / webhook
# resumption keep working.
restartPolicyType        = "ON_FAILURE"
restartPolicyMaxRetries  = 5

# Number of replicas. Start at 1 — scale horizontally only after we have
# stickiness or shared rate-limit state in Redis.
numReplicas = 1
